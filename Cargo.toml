tree-sitter-zsh = { version = "0.63.4", default-features = false, optional = true }
tree-sitter-ini = { version = "1.4.0", default-features = false, optional = true }
tree-sitter-kconfig = { version = "1.3.0", default-features = false, optional = true }
tree-sitter-jinja = { version = "0.13.0", default-features = false, optional = true }
