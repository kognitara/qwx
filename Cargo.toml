tree-sitter-json = { version = "0.24.8", default-features = false, optional = true }
tree-sitter-diff = { version = "0.1.0", default-features = false, optional = true }
tree-sitter-glsl = { version = "0.2.0", default-features = false, optional = true }
tree-sitter-hlsl = { version = "0.2.0", default-features = false, optional = true }
tree-sitter-lua = { version = "0.5.0", default-features = false, optional = true }
tree-sitter-highlight = "0.26.11"

