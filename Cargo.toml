[package]
name = "qwx"
version = "0.0.1"
edition = "2024"
description = "Data Walk eXtended"
license = "AGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/kognitara/qwx.git"

[dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
crossterm = "0.29.0"
jwalk = "0.8.1"
ropey = "1.6.1"
syntect = "5.3.0"
tokio = { version = "1.53.1", features = ["full"] }
unicode-width = "0.2.2"
walkdir = "2.5.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
