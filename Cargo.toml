[package]
name = "qwx"
version = "0.0.3"
edition = "2024"
description = "Quaternary Walk Extended"
license = "AGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/kognitara/qwx.git"

[profile.release]
opt-level = 3       # Optimisation maximale pour la vitesse (remplace "z")
lto = true          # Link Time Optimization "fat" (analyse tout le graphe d'un coup)
codegen-units = 1   # Force un seul thread de compilation pour maximiser l'optimisation
panic = "abort"     # Supprime le code de "stack unwinding" (gagne en vitesse et en taille)
strip = true        # On garde ça pour virer les symboles de debug

[dependencies]
clap = "4.6.6"
clap_complete = "4.6.9"
crossterm = "0.29.0"
dirs = "6.0.0"
git2 = { version = "0.21.0", features = ["https", "ssh"] }
ignore = "0.4.31"
indicatif = "0.18.6"
inquire = "0.9.4"
num_cpus = "1.17.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "form", "native-tls"] }
ropey = "1.6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2.2"
walkdir = "2.5.0"
urlencoding = "2.1.3"
tree-sitter = "0.26.11"
crates_io_api = "0.12.0"
is_executable = "1.0.6"
tree-sitter-c = { version = "0.24.2", default-features = false, optional = true }
tree-sitter-d = { version = "0.8.2", default-features = false, optional = true }
tree-sitter-rust = { version = "0.24.2", default-features = false, optional = true }
tree-sitter-java = { version = "0.23.5", default-features = false, optional = true }
tree-sitter-python = { version = "0.25.0", default-features = false, optional = true }
tree-sitter-perl = { version = "1.1.2", default-features = false, optional = true }
tree-sitter-ada = { version = "0.1.0", default-features = false, optional = true }
tree-sitter-agda = { version = "1.3.3", default-features = false, optional = true }
tree-sitter-asm = { version = "0.24.0", default-features = false, optional = true, features = ["wasm"] }
tree-sitter-bash = { version = "0.25.1", default-features = false, optional = true }
tree-sitter-fish = { version = "3.6.0", default-features = false, optional = true }
tree-sitter-batch = { version = "0.11.1", default-features = false, optional = true }
tree-sitter-c-sharp = { version = "0.23.5", default-features = false, optional = true }
tree-sitter-cmake = { version = "0.7.4", default-features = false, optional = true }
tree-sitter-cpp = { version = "0.23.4", default-features = false, optional = true }
tree-sitter-css = { version = "0.25.0", default-features = false, optional = true }
tree-sitter-scss = { version = "1.0.0", default-features = false, optional = true }
tree-sitter-dart = { version = "0.2.0", default-features = false, optional = true }
tree-sitter-elixir = { version = "0.3.5", default-features = false, optional = true }
tree-sitter-elm = { version = "5.9.4", default-features = false, optional = true }
tree-sitter-erlang = { version = "0.20.0", default-features = false, optional = true }
tree-sitter-fsharp = { version = "0.3.11", default-features = false, optional = true }
tree-sitter-go = { version = "0.25.0", default-features = false, optional = true }
tree-sitter-haskell = { version = "0.23.1", default-features = false, optional = true }
tree-sitter-graphql = { version = "0.2.1", default-features = false, optional = true }
